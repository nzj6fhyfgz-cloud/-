function home(){$("ha").textContent=d.a;$("hr").textContent=d.a?Math.round(d.c/d.a*100)+"%":"—";$("hw").textContent=d.weak.length}home();render();
let mqs=[],mi=0,mans=[];document.querySelectorAll(".mockStart").forEach(b=>b.onclick=()=>{mqs=sh(Q).slice(0,+b.dataset.n);mi=0;mans=[];$("ms").classList.add("hidden");$("mr").classList.add("hidden");$("mp").classList.remove("hidden");mrender()});function mrender(){let q=mqs[mi];$("mprog").textContent=`${mi+1}/${mqs.length}｜${q.subject}`;$("mq").textContent=q.q;$("mc").innerHTML="";q.choices.forEach((c,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=`${i+1}. ${c}`;b.onclick=()=>{mans.push(i);++mi<mqs.length?mrender():finish()};$("mc").appendChild(b)})}
function finish(){let c=0,by={};SUBJECTS.forEach(s=>by[s]={a:0,c:0});mqs.forEach((q,i)=>{let ok=mans[i]===q.answer,qi=Q.indexOf(q);if(ok)c++;by[q.subject].a++;if(ok)by[q.subject].c++;d.a++;if(ok)d.c++;d.sub[q.subject].a++;if(ok)d.sub[q.subject].c++;if(!ok){d.wrong[qi]=(d.wrong[qi]||0)+1;if(!d.weak.includes(qi))d.weak.push(qi)}});let r=Math.round(c/mqs.length*100);d.mocks.unshift({date:new Date().toLocaleString("ja-JP"),n:mqs.length,c,r});d.mocks=d.mocks.slice(0,20);save();$("mp").classList.add("hidden");$("mr").classList.remove("hidden");$("score").textContent=`${c}/${mqs.length}（${r}%）`;$("bd").innerHTML=SUBJECTS.filter(s=>by[s].a).map(s=>`<div class="row"><div>${s}</div><div>${by[s].c}/${by[s].a}</div><div>${Math.round(by[s].c/by[s].a*100)}%</div></div>`).join("");home()}
$("again").onclick=()=>{$("mr").classList.add("hidden");$("ms").classList.remove("hidden")};
function analysis(){$("aa").textContent=d.a;$("ar").textContent=d.a?Math.round(d.c/d.a*100)+"%":"—";$("am").textContent=d.mocks.length;let rank=SUBJECTS.map(s=>({s,...d.sub[s],r:d.sub[s].a?d.sub[s].c/d.sub[s].a:null})).filter(x=>x.a).sort((a,b)=>a.r-b.r);$("weakest").innerHTML=rank.length?"苦手候補：<b>"+rank.slice(0,3).map(x=>`${x.s} ${Math.round(x.r*100)}%`).join(" / ")+"</b>":"まだ回答データがありません。";$("ss").innerHTML=SUBJECTS.map(s=>{let x=d.sub[s],r=x.a?Math.round(x.c/x.a*100):0;return `<div class="row"><div>${s}<div class="bar"><i style="width:${r}%"></i></div></div><div>${x.c}/${x.a}</div><div>${x.a?r+"%":"—"}</div></div>`}).join("");$("hist").innerHTML=d.mocks.length?d.mocks.slice(0,10).map(m=>`<div class="row"><div>${m.date}</div><div>${m.c}/${m.n}</div><div>${m.r}%</div></div>`).join(""):'<div class="muted">まだ模試履歴はありません。</div>'}
$("reset").onclick=()=>{if(confirm("学習履歴・苦手登録・模試履歴をすべて削除しますか？")){localStorage.removeItem(KEY);location.reload()}};if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
